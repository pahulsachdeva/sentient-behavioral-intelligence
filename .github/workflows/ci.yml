name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Generate evaluation readouts
        run: |
          mkdir -p evaluation-output
          node scripts/evaluate.js > evaluation-output/report.md
          node scripts/evaluate.js --json > evaluation-output/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: construct-evaluation
          path: evaluation-output/
